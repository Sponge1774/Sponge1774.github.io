*{

}

html{

}

body{

nav{

}

.nav-content{
    min-height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-weight:800;

}

.nav-links{
    display:flex;

    list-style:none;
}

.nav-links a{
    color:#cbd5e1;

    font-size:.92rem;
    transition:color .2s;
}

.nav-links a:hover{
    color:#fff;

}

.hero{
    max-width:900px;
    margin:0 auto;
    text-align:center;
}

.eyebrow{
    display:inline-block;
    padding:7px 14px;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,.18);
    border-radius:999px;
    background:rgba(255,255,255,.07);
    color:#bfdbfe;
    font-size:.85rem;
    font-weight:700;
    letter-spacing:.4px;
}

header h1{
    font-size:clamp(2.4rem,6vw,4.5rem);
    line-height:1.08;
    margin-bottom:20px;
    letter-spacing:-1.8px;
}

.hero-subtitle{
    max-width:760px;

    color:#cbd5e1;
    font-size:clamp(1rem,2.5vw,1.25rem);
}

.links{
    display:flex;

    flex-wrap:wrap;
    gap:12px;

.links a,
.botao{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    border-radius:10px;
    font-weight:700;
    transition:transform .2s,background .2s,box-shadow .2s;
}

.links a{
    padding:12px 22px;
    background:var(--primary);
    color:#fff;
    box-shadow:0 8px 20px rgba(37,99,235,.25);
}

.links a.secondary{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.18);
}

.links a:hover,
.botao:hover{
    transform:translateY(-2px);
}

.links a:hover{
    background:var(--primary-dark);
}

/* SEÇÕES */

section{
    padding:68px 0 0;
}

.section-heading{
    margin-bottom:28px;
}

.section-kicker{
    color:var(--primary);
    font-size:.78rem;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1.5px;
    margin-bottom:6px;
}

section h2{
    font-size:clamp(1.7rem,4vw,2.25rem);
    line-height:1.2;
    color:var(--dark);
}

.sobre,
.formacao{
    background:var(--surface);
    padding:34px;
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
}

.sobre p{
    color:#475569;
}

.sobre p+p{
    margin-top:18px;
}

.formacao h3{
    color:var(--dark);
    margin-bottom:8px;
}

.formacao p{
    color:#64748b;
}

    display:flex;
    flex-wrap:wrap;
    gap:11px;
}

    font-weight:700;

    transition:transform .2s,border-color .2s;
}

.habilidade:hover{
    transform:translateY(-2px);
    border-color:#93c5fd;
}

}
